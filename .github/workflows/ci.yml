name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'
        if: github.event_name == 'pull_request'

  codegen:
    runs-on: ubuntu-latest
    needs: proto-lint
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - uses: dtolnay/rust-toolchain@stable
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - run: cargo install protoc-gen-prost protoc-gen-tonic
      - run: buf generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: |
            core-services/gen/go/
            bs-ran/crates/proto-gen/src/open6gair/
          retention-days: 1

  rust:
    runs-on: ubuntu-latest
    needs: codegen
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/download-artifact@v4
        with:
          name: generated-code
      - run: cargo fmt --manifest-path bs-ran/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path bs-ran/Cargo.toml --workspace -- -D warnings
      - run: cargo build --manifest-path bs-ran/Cargo.toml --workspace

  go:
    runs-on: ubuntu-latest
    needs: codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: core-services/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: generated-code
      - run: go build ./...
        working-directory: core-services
      - run: go vet ./...
        working-directory: core-services
